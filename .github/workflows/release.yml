name: Release Windows application

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Releases must be dispatched from the main branch.'
          }

          [xml] $versionFile = Get-Content Version.props -Raw
          $version = [string] $versionFile.Project.PropertyGroup.VersionPrefix
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Version.props must contain a stable SemVer VersionPrefix; found '$version'."
          }

          $tag = "v$version"
          if (git tag --list $tag) {
            throw "Git tag $tag already exists. Increment VersionPrefix before releasing again."
          }

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw "GitHub Release $tag already exists. Increment VersionPrefix before releasing again."
          }

          $archive = "RaceDock-$tag-win-x64.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          dotnet restore RaceDock.slnx
          dotnet restore RaceDock/RaceDock.csproj -r win-x64

      - name: Run tests
        run: dotnet run --project RaceDock.Tests -c Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish RaceDock/RaceDock.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o artifacts/publish `
            -p:SourceRevisionId=${{ github.sha }} `
            -p:RaceDockDistributionBuild=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugSymbols=false `
            -p:DebugType=None

      - name: Package release
        shell: pwsh
        run: |
          $archive = 'artifacts/${{ steps.version.outputs.archive }}'
          $checksum = 'artifacts/${{ steps.version.outputs.checksum }}'
          Compress-Archive -Path artifacts/publish/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.version.outputs.archive }}" | Set-Content $checksum -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RaceDock-${{ steps.version.outputs.tag }}-win-x64
          path: |
            artifacts/${{ steps.version.outputs.archive }}
            artifacts/${{ steps.version.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create Git tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            'artifacts/${{ steps.version.outputs.archive }}' `
            'artifacts/${{ steps.version.outputs.checksum }}' `
            --target '${{ github.sha }}' `
            --generate-notes `
            --title 'RaceDock ${{ steps.version.outputs.version }}'
